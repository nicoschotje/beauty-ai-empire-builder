let _editSnap=false;
function wireCanvas(){
  const page=$('#page');
  page.addEventListener('focusin',e=>{
    const t=e.target;
    if(t.dataset && t.dataset.edit && !_editSnap){
      snapshot(); _editSnap=true;
    }
  });
  page.addEventListener('input',e=>{
    const t=e.target;
    if(!t.dataset||!t.dataset.edit) return;
    const blk=t.closest('.blk'); if(!blk) return;
    const node=findNode(blk.dataset.id); if(!node) return;
    const f=t.dataset.edit;
    if(f==='content') node.content=t.textContent;
    else if(f==='list') node.props.items[+t.dataset.idx]=t.textContent;
    else if(f==='faqq') node.props.items[+t.dataset.idx].q=t.textContent;
    else if(f==='faqa') node.props.items[+t.dataset.idx].a=t.textContent;
    auditDebounced();
  });
  page.addEventListener('focusout',e=>{
    if(e.target.dataset&&e.target.dataset.edit){
      _editSnap=false; save(true);
      if(state.selectedId===e.target.closest('.blk').dataset.id) renderInspector();
    }
  });
  page.addEventListener('click',e=>{
    if(state.preview) return;
    if(e.target.dataset && e.target.dataset.edit){
      const blk=e.target.closest('.blk');
      if(blk && blk.dataset.id!==state.selectedId){
        state.selectedId=blk.dataset.id;
        $$('#page .blk.selected').forEach(x=>x.classList.remove('selected'));
        blk.classList.add('selected');
        renderLayers(); renderInspector();
      }
      return; /* keep caret */
    }
    const blk=e.target.closest('.blk');
    if(blk){ e.stopPropagation(); selectNode(blk.dataset.id); }
  });
  /* image drag-drop */
  page.addEventListener('dragover',e=>{
    const img=e.target.closest('.blk-image');
    if(img){e.preventDefault();img.classList.add('img-drop');}
  });
  page.addEventListener('dragleave',e=>{
    const img=e.target.closest('.blk-image');
    if(img) img.classList.remove('img-drop');
  });
  page.addEventListener('drop',e=>{
    const img=e.target.closest('.blk-image');
    if(!img) return;
    e.preventDefault(); img.classList.remove('img-drop');
    const f=e.dataTransfer.files[0];
    if(!f||!f.type.startsWith('image/')) return;
    const node=findNode(img.dataset.id);
    const rd=new FileReader();
    rd.onload=()=>{
      snapshot();
      node.props.src=rd.result;
      if(!node.props.alt) node.props.alt=f.name.replace(/\.[^.]+$/,'');
      liveContent(node); save(true); audit();
      toast('Image dropped in','🖼');
    };
    rd.readAsDataURL(f);
  });
}

   ============================================================ */
function isTyping(){
  const a=document.activeElement;
  return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);
}
function keyNav(dir){
  const list=flatten(state.page.root);
  if(!list.length) return;
  const node=findNode(state.selectedId);
  let idx=node?list.indexOf(node):-1;
  if(dir==='down') idx=Math.min(list.length-1,idx+1);
  else if(dir==='up') idx=Math.max(0,idx-1);
  else if(dir==='right'){ if(node&&node.children&&node.children.length){
      selectNode(node.children[0].id);return;} }
  else if(dir==='left'){ const p=parentMap[state.selectedId];
      if(p&&p.type!=='page'){selectNode(p.id);return;} }
  if(idx<0) idx=0;
  selectNode(list[idx].id);
}
function onKey(e){
  const mod=e.metaKey||e.ctrlKey;
  /* command palette */
  if(mod && e.key.toLowerCase()==='k'){ e.preventDefault();
    if($('#cmdk').classList.contains('on')) closeCmd(); else openAngie(); return; }
  if(e.key==='Escape'){
    if($('#cmdk').classList.contains('on')) closeCmd();
    else if($('#angie').classList.contains('open')) closeAngie();
    return;
  }
  if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); save(false); return; }
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault();
    if(e.shiftKey) redo(); else undo(); return; }
  if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod && e.key.toLowerCase()==='p'){ e.preventDefault(); togglePreview(); return; }
  if(isTyping()) return;
  if(mod && e.key.toLowerCase()==='d'){ e.preventDefault();
    if(state.selectedId) duplicateNode(state.selectedId); return; }
  if((e.key==='Delete'||e.key==='Backspace') && state.selectedId){
    e.preventDefault(); deleteNode(state.selectedId); return; }
  if(state.selectedId){
    if(mod && e.key==='ArrowUp'){e.preventDefault();moveNode(state.selectedId,-1);return;}
    if(mod && e.key==='ArrowDown'){e.preventDefault();moveNode(state.selectedId,1);return;}
    if(e.key==='ArrowDown'){e.preventDefault();keyNav('down');return;}
    if(e.key==='ArrowUp'){e.preventDefault();keyNav('up');return;}
    if(e.key==='ArrowRight'){e.preventDefault();keyNav('right');return;}
    if(e.key==='ArrowLeft'){e.preventDefault();keyNav('left');return;}
  }
}

/* ============================================================
   PAGESPEED OPTIMIZER
   ============================================================ */
function perfAudit(){
  buildParentMap(state.page.root);
  const all=flatten(state.page.root);
  const imgs=all.filter(n=>n.type==='image');
  let score=100; const items=[]; const metrics={};

  /* CLS — images without reserved space */
  const noDim=imgs.filter(n=>!n.styles.height&&!n.styles.aspectRatio
    &&!(/px$/.test(n.styles.width||'')));
  metrics.cls=noDim.length?'At risk':'Stable';
  if(noDim.length){
    score-=Math.min(24,noDim.length*6);
    items.push({sev:'warn',
      title:noDim.length+' image'+(noDim.length>1?'s':'')+' can shift layout (CLS)',
      detail:'Images without a reserved aspect-ratio push content down as they '
        +'load, causing Cumulative Layout Shift. Reserving space fixes it.',
      fix:()=>noDim.forEach(n=>setStyle(n,'aspectRatio','4 / 3'))});
  }
  /* heavy embedded images */
  const heavy=imgs.filter(n=>(n.props.src||'').length>100000);
  if(heavy.length){
    score-=Math.min(20,heavy.length*9);
    items.push({sev:'err',
      title:heavy.length+' oversized embedded image'+(heavy.length>1?'s':''),
      detail:'Large base64 images inflate the document and delay first paint. '
        +'Compress them or host them on a CDN.',manual:true});
  }
  /* font families */
  const fonts=new Set(['Inter (default)']);
  all.forEach(n=>{if(n.styles.fontFamily)fonts.add(n.styles.fontFamily);});
  metrics.fonts=fonts.size;
  if(fonts.size>2){
    score-=(fonts.size-2)*7;
    items.push({sev:'warn',title:fonts.size+' font families load',
      detail:'Every web font is a render-blocking request. Consolidating to one '
        +'family speeds up First Contentful Paint.',
      fix:()=>{const keep=[...fonts].find(f=>f!=='Inter (default)');
        if(keep) all.forEach(n=>{if(n.styles.fontFamily)setStyle(n,'fontFamily',keep);});}});
  }
  /* DOM size */
  metrics.dom=all.length;
  if(all.length>120){
    score-=12;
    items.push({sev:'info',title:'Large DOM ('+all.length+' nodes)',
      detail:'Browsers render fewer nodes faster. Trim decorative blocks or '
        +'split very long pages.',manual:true});
  }
  /* document weight */
  const weight=buildExportHTML().length;
  metrics.weight=Math.round(weight/1024)+' KB';
  if(weight>45000){
    score-=Math.min(14,Math.round((weight-45000)/4000));
    items.push({sev:'info',title:'Document weight '+metrics.weight,
      detail:'Inline-styled markup is portable but heavy. Extract shared styles '
        +'to a stylesheet for production builds.',manual:true});
  }
  /* above-the-fold animations delay LCP (first ~2 sections) */
  const aboveFold=state.page.root.children.slice(0,2);
  if(aboveFold.length){
    const fa=[];
    aboveFold.forEach(s=>flatten(s).forEach(n=>{
      if(n.anim&&n.anim.type!=='none') fa.push(n);
    }));
    if(fa.length){
      score-=6;
      items.push({sev:'warn',
        title:fa.length+' animation'+(fa.length>1?'s':'')+' above the fold',
        detail:'Entrance animations on the first section delay Largest '
          +'Contentful Paint. Disable them so hero content renders instantly.',
        fix:()=>fa.forEach(n=>n.anim.type='none')});
    }
  }
  score=Math.max(20,Math.round(score));
  return {score,items,metrics};
}
function renderSpeedPanel(body){
  const p=state.perf||perfAudit();
  body.innerHTML='';
  const score=p.score;
  const col=score>=85?'#10b981':score>=60?'#f59e0b':'#ef4444';
  const dash=Math.PI*2*22;
  const ring=document.createElement('div'); ring.className='audit-score';
  ring.innerHTML=`<div class="score-ring"><svg width="54" height="54">`
    +`<circle cx="27" cy="27" r="22" fill="none" stroke="#ffffff14" stroke-width="6"/>`
    +`<circle cx="27" cy="27" r="22" fill="none" stroke="${col}" stroke-width="6" `
    +`stroke-linecap="round" stroke-dasharray="${dash}" `
    +`stroke-dashoffset="${dash*(1-score/100)}" transform="rotate(-90 27 27)"/></svg>`
    +`<div class="num" style="color:${col}">${score}</div></div>`
    +`<div><div class="lbl">PageSpeed score</div>`
    +`<div class="sub">Estimated · Core Web Vitals heuristics</div></div>`;
  body.appendChild(ring);
  const m=p.metrics;
  const mg=document.createElement('div'); mg.className='speed-metrics';
  mg.innerHTML=
     `<div class="smetric"><div class="v">${m.dom}</div><div class="l">DOM nodes</div></div>`
    +`<div class="smetric"><div class="v">${m.weight}</div><div class="l">Doc weight</div></div>`
    +`<div class="smetric"><div class="v">${m.fonts}</div><div class="l">Font families</div></div>`
    +`<div class="smetric"><div class="v">${m.cls}</div><div class="l">Layout shift</div></div>`;
  body.appendChild(mg);
  if(!p.items.length){
    body.innerHTML+='<div class="empty-sug"><span class="em">⚡</span>'
      +'<b>Blazing fast!</b><br>No PageSpeed issues detected.</div>';
    return;
  }
  p.items.forEach(it=>{
    const sevEm={err:'⛔',warn:'⚠️',info:'💡'}[it.sev]||'💡';
    const card=document.createElement('div'); card.className='sug '+it.sev;
    card.innerHTML=`<div class="sug-h"><span class="sev">${sevEm}</span>`
      +`<span class="t">${it.title}</span></div><div class="sug-d">${it.detail}</div>`;
    const act=document.createElement('div'); act.className='sug-act';
    if(it.fix){
      const b=document.createElement('button');
      b.className='sug-apply'; b.textContent='⚡ One-click fix';
      b.addEventListener('click',()=>{
        snapshot(); it.fix(); renderAll(); save(true); audit();
        toast('Speed fix applied','⚡');
      });
      act.appendChild(b);
    } else {
      const s=document.createElement('span');
      s.className='fix-manual'; s.textContent='MANUAL';
      act.appendChild(s);
    }
    card.appendChild(act);
    body.appendChild(card);
  });
}

/* ============================================================
   ONBOARDING TOUR
   ============================================================ */
const SAMPLE_PROMPT='SaaS landing page for an AI scheduling tool, modern, friendly.';
const TOUR=[
  {art:'✦',n:'Welcome',t:'Meet Angie',
   d:'Your agentic page builder. Describe a layout in plain English and Angie '
    +'generates real, editable blocks — 100% offline, no API keys.'},
  {art:'🧱',n:'Step 1 of 4',t:'Blocks & Layers',
   d:'The left panel shows every block as a live tree. Switch to the Blocks tab '
    +'to drop in ready-made composite sections.'},
  {art:'🎛',n:'Step 2 of 4',t:'The Inspector',
   d:'Select any block to fine-tune typography, the visual box-model, colors, '
    +'gradients, borders, shadows and scroll animations.'},
  {art:'🩺',n:'Step 3 of 4',t:'Live Audits & PageSpeed',
   d:'Angie continuously checks SEO, accessibility, conversion and PageSpeed — '
    +'every issue ships with a one-click fix.'},
  {art:'🚀',n:'Step 4 of 4',t:'Build your first page',
   d:'Ready? Angie will generate a complete sample SaaS landing page so you can '
    +'explore a real, multi-section project.',build:true},
];
let tourIdx=0;
function startTour(){ tourIdx=0; $('#tour').classList.remove('hide'); tourRender(); }
function closeTour(){
  $('#tour').classList.add('hide');
  try{localStorage.setItem('angie_tour_done','1');}catch(e){}
}
function tourRender(){
  const s=TOUR[tourIdx];
  $('#tourArt').textContent=s.art;
  $('#tourStepN').textContent=s.n;
  $('#tourT').textContent=s.t;
  $('#tourD').textContent=s.d;
  $('#tourDots').innerHTML=TOUR.map((_,i)=>
    `<i class="${i===tourIdx?'on':''}"></i>`).join('');
  $('#tourBack').style.visibility=tourIdx===0?'hidden':'visible';
  $('#tourNext').textContent=s.build?'🚀 Build my sample page':'Next →';
}
function tourNext(){
  if(TOUR[tourIdx].build){ closeTour(); buildSample(); return; }
  tourIdx=Math.min(TOUR.length-1,tourIdx+1); tourRender();
}
function tourBack(){ tourIdx=Math.max(0,tourIdx-1); tourRender(); }
function buildSample(){
  const created=generateFromIntent(SAMPLE_PROMPT);
  save(true);
  state.agTab='chat';
  agMsg('u',SAMPLE_PROMPT);
  agMsg('a',`Built your sample — a complete <b>${created?created.length:9}-section</b> `
    +`SaaS landing page for an <b>AI scheduling tool</b>. Explore the `
    +`<b>Audit</b> and <b>Speed</b> tabs, then edit anything inline.`);
  openAngie(false);
  toast('Sample SaaS landing page built','🚀');
}

/* ============================================================
   WIRE UP UI
   ============================================================ */
function wireUI(){
  $('#btnUndo').onclick=undo;
  $('#btnRedo').onclick=redo;
  $('#btnSave').onclick=()=>save(false);
  $('#btnPreview').onclick=togglePreview;
  $('#btnTour').onclick=startTour;
  $('#tourSkip').onclick=closeTour;
  $('#tourNext').onclick=tourNext;
  $('#tourBack').onclick=tourBack;
  const em=$('#exportMenu');
  $('#btnExport').onclick=e=>{e.stopPropagation();em.classList.toggle('hide');};
  em.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    em.classList.add('hide');
    if(b.dataset.x==='html') exportHTML();
    else if(b.dataset.x==='json') exportJSON();
    else if(b.dataset.x==='embed') copyEmbed();
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.tb-menu-wrap')) em.classList.add('hide');
  });
  $('#btnAngie').onclick=()=>openAngie();
  $('#angieClose').onclick=closeAngie;
  $('#overlay').onclick=closeCmd;
  $('#pageTitle').addEventListener('input',e=>{
    state.page.settings.title=e.target.value; auditDebounced();
  });
  $('#devices').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b) setDevice(b.dataset.d);
  });
  $('#leftTabs').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state.leftTab=b.dataset.t;
    $$('#leftTabs button').forEach(x=>x.classList.toggle('on',x===b));
    renderLayers(); renderLibrary();
  });
  $('#inspTabs').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state.inspTab=b.dataset.t; renderInspector();
  });
  $('#agTabs').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    state.agTab=b.dataset.t; renderAngie();
  });
  const ai=$('#agInput');
  ai.addEventListener('input',()=>{ai.style.height='auto';
    ai.style.height=Math.min(90,ai.scrollHeight)+'px';});
  ai.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();angieSend(ai.value);}
  });
  $('#agSend').onclick=()=>angieSend(ai.value);
  /* chips */
  const chips=['Add a hero with gradient + 3 pricing tiers',
    'Testimonial slider below a features grid','FAQ section and a footer',
    'Stats bar, gallery and a CTA'];
  const cw=$('#agChips');
  chips.forEach(c=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=c;
    b.onclick=()=>{ai.value=c;angieSend(c);};
    cw.appendChild(b);
  });
  /* cmd palette input */
  $('#cmdInput').addEventListener('input',e=>filterCmd(e.target.value));
  $('#cmdInput').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdFiltered.length-1,cmdSel+1);renderCmd();}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);renderCmd();}
    else if(e.key==='Enter'){e.preventDefault();
      const c=cmdFiltered[cmdSel]; if(c){c[4]();closeCmd();}}
    else if(e.key==='Escape'){closeCmd();}
  });
  document.addEventListener('keydown',onKey);
  wireCanvas();
}

/* ============================================================
   INIT
   ============================================================ */
function seedPage(){
  state.page=newPage();
  state.page.settings.title='Lumière — AI Beauty Studio';
  ['navbar','hero','features','stats','pricing','testimonials','faq','cta','footer']
    .forEach(k=>addSection(k,{gradient:true},false));
}
function init(){
  const firstRun=!load();
  if(firstRun){ seedPage(); }
  /* migrate: ensure shape */
  if(!state.page.root) state.page=newPage();
  $('#pageTitle').value=state.page.settings.title||'Untitled Page';
  buildParentMap(state.page.root);
  state.chat=[{role:'a',html:'Hi, I\'m <b>Angie</b> ✦ — your agentic page builder. '
    +'Describe a section or a whole layout in plain English and I\'ll generate '
    +'editable blocks live. I also audit your page for SEO, accessibility and '
    +'conversion issues on every edit. Try a suggestion chip below 👇'}];
  wireUI();
  renderAll();
  renderAngie();
  audit();
  syncUndo();
  setDevice('desktop');
  toast('Elementor Angie ready','✦');
  let tourDone=false;
  try{tourDone=!!localStorage.getItem('angie_tour_done');}catch(e){}
  if(!tourDone) setTimeout(startTour,500);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

</script>
