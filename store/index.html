<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFAF6" />
  <title>Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Top bar -->
  <header id="site-header">
    <div class="header-inner">
      <a href="/store/" class="brand">
        <img id="brand-logo" src="" alt="" class="brand-logo hidden" />
        <span id="brand-name" class="brand-name">Store</span>
      </a>
      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" type="search" placeholder="Search products…" autocomplete="off" />
      </div>
      <button id="cart-btn" class="cart-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </button>
    </div>
  </header>

  <!-- Hero banner -->
  <section id="hero" class="hero hidden">
    <div class="hero-inner">
      <div class="hero-text">
        <h1 id="hero-title"></h1>
        <p id="hero-subtitle"></p>
        <a id="hero-cta" href="#products" class="btn-primary hidden">Shop Now</a>
      </div>
      <div class="hero-image">
        <img id="hero-img" src="" alt="" />
      </div>
    </div>
  </section>

  <!-- Category pills -->
  <nav id="categories" class="categories">
    <div class="categories-inner">
      <button class="cat-pill active" data-cat="all">All</button>
    </div>
  </nav>

  <!-- Product grid -->
  <main id="products" class="products-section">
    <div id="product-grid" class="product-grid">
      <div class="loading-state">Loading products…</div>
    </div>
  </main>

  <!-- Product detail modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="site-footer">
    <div class="footer-inner">
      <p id="footer-name"></p>
      <p id="footer-contact"></p>
    </div>
  </footer>

  <!-- Supabase SDK (same version as dashboard) -->
  <script>window.__MBG_SUPA_KEY__ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrbW5oZ2F0dGtpeml1eWtoY3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3NjU1MzksImV4cCI6MjA4ODM0MTUzOX0.l2ErPyJe6q2sI4UpNtRp9qRfeVkfdrHSOdkensj83IA';</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- Store app -->
  <script type="module" src="./js/store.js"></script>
</body>
</html>
