# Mr. Beanie's Greenies — Netlify build & runtime config (P3 + P7.4)
#
# Each site that connects to this repo sets its own publish directory
# in its Netlify UI (storefront vs dashboard-v2). We do NOT set
# [build].publish here because that would override the per-site UI
# setting and force both sites to use the same publish dir.
#
# Headers below apply to every response served from any Netlify project
# built from this repo.

# ─── Security headers ────────────────────────────────────────────────
[[headers]]
  for = "/*"
    [headers.values]
        X-Content-Type-Options    = "nosniff"
            X-Frame-Options           = "SAMEORIGIN"
                Referrer-Policy           = "strict-origin-when-cross-origin"
                    Permissions-Policy        = "geolocation=(self), camera=(self), microphone=(), payment=()"
                        Strict-Transport-Security = "max-age=31536000; includeSubDomains"
                            Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.telegram.org https://nominatim.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

                            # ─── SPA fallback ─────────────────────────────────────────────────────
                            [[redirects]]
                              from   = "/*"
                                to     = "/index.html"
                                  status = 200

                                  # ─── Long-cache static assets ─────────────────────────────────────────
                                  [[headers]]
                                    for = "/css/*"
                                      [headers.values]
                                          Cache-Control = "public, max-age=31536000, immutable"

                                          [[headers]]
                                            for = "/js/*"
                                              [headers.values]
                                                  Cache-Control = "public, max-age=31536000, immutable"

                                                  [[headers]]
                                                    for = "/manifest.json"
                                                      [headers.values]
                                                          Cache-Control = "public, max-age=3600"

                                                          # ─── No-cache for the HTML shell so deploys are visible instantly ────
                                                          [[headers]]
                                                            for = "/index.html"
                                                              [headers.values]
                                                                  Cache-Control = "no-cache, must-revalidate"
                                                                  
